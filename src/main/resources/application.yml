# ==============================================================================
# Tubes Scheduler - Application Configuration
# Sistem Penjadwalan Tugas Besar Presentasi - Teknik Informatika UNPAR
# ==============================================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tubes-scheduler

  # ----------------------------------------------------------------------------
  # PostgreSQL Datasource Configuration
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_penjadwalan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TubesSchedulerHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ----------------------------------------------------------------------------
  # JPA & Hibernate Properties
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ----------------------------------------------------------------------------
  # File Upload Settings (Excel .xlsx Import)
  # ----------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
app:
  jwt:
    # 256-bit or greater secret key for HMAC-SHA
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours in milliseconds

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.unpar.scheduler: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
